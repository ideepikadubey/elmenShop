name: Deploy Elmen Shop

on:
  push:
    branches:
      - Main

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 30m
          command_timeout: 30m
          script_stop: false
          request_pty: true

          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "============================"
            echo "Starting Deployment..."
            echo "============================"

            cd /var/www/elmenShop

            git fetch origin
            git reset --hard origin/Main

            echo "Building Frontend..."
            cd frontend
            npm install --no-audit --no-fund
            npm run build
            cd ..

            echo "Installing & Restarting Backend..."
            cd backend
            npm install --omit=dev --no-audit --no-fund
            cd ..

            echo "Restarting PM2 Server Process..."
            pm2 restart elmenshop --update-env || pm2 start backend/server.js --name elmenshop || true

            echo "Saving PM2 state..."
            pm2 save || true

            echo "Deployment Completed Successfully"
            echo "======END======"