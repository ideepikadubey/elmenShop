name: Deploy Elmen Shop

on:
  push:
    branches:
      - Main

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 30m
          command_timeout: 30m
          script_stop: true
          request_pty: true
          debug: true

          script: |
            set -e

            echo "============================"
            echo "Starting Deployment..."
            echo "============================"

            cd /var/www/elmenShop

            git fetch origin
            git reset --hard origin/Main

            echo "Building Frontend..."
            cd frontend
            npm install
            npm run build
            cd ..

            echo "Installing & Restarting Backend..."
            cd backend
            npm install --omit=dev
            cd ..
            pm2 restart elmenshop --update-env || pm2 start backend/server.js --name elmenshop

            echo "Checking Backend Health..."
            sleep 3
            curl -s --retry 5 --retry-connrefused --retry-delay 2 http://127.0.0.1:5000/api/health || true

            pm2 save

            echo "Deployment Completed Successfully"
            echo "======END======"